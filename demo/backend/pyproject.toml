[project]
name = "trustcall-demo-backend"
version = "0.1.0"
description = "FastAPI backend of the trustcall-system-one demo UI."
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.161.1",
    "pypdf>=5",
    "python-multipart>=0.0.9",
    # The published pre-release is what FastAPI Cloud installs. To develop
    # against the local checkout, see README.md ("Develop against the local library").
    "trustcall-system-one[jsonschema]==0.1.0a2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-socket>=0.7",
    "mypy>=1.11",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "D", "UP", "B", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["dydantic.*", "pypdf.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
