[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trustcall-system-one"
version = "0.1.0a0"
description = "Validated multi-entity extraction and JSON-Patch updates on Cloudflare System One models (Clairic + Clef)."
readme = "README.md"
license = "Unlicense"
requires-python = ">=3.10,<4.0"
dependencies = [
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
  "jsonpatch>=1.33,<2",
  "jsonpointer>=2.4",
  "typing-extensions>=4.9",
]

[project.optional-dependencies]
jsonschema = ["dydantic>=0.0.8,<1.0"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-socket>=0.7",
  "pytest-xdist>=3.6",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "jsonschema>=4.26.0",
  "hypothesis-jsonschema>=0.23.1",
  "types-jsonschema>=4.26.0.20261006",
]

[tool.hatch.build.targets.wheel]
packages = ["trustcall_system_one"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "D", "UP", "B", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"examples/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
files = ["trustcall_system_one", "tests"]

[[tool.mypy.overrides]]
module = ["jsonpatch.*", "jsonpointer.*", "dydantic.*", "hypothesis_jsonschema.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -vv --durations=5"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "live: hits the real Cloudflare API (needs TRUSTCALL_S1_LIVE and credentials)",
  "eval: live accuracy evals",
]
